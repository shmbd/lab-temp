    - probiotics
    - safety-and-resistome

- title: Probiotics for Human Health
  subtitle: Research Focus · MBD-RF-01
  group: track
  image: images/project-probiotics.svg
  link: research/?search=Weissella
  description: Isolation, taxonomic identification, and multi-trait functional characterization of beneficial lactic acid and dairy-associated microbial strains, pairing _in vitro_ gastrointestinal resilience assays with pangenome-informed evaluation.
  tags:
    - probiotics
    - functional-screening
    - comparative-genomics

- title: Microbial Natural-Product Discovery
  subtitle: Research Focus · MBD-RF-02
  group: track
  image: images/project-discovery.svg
  link: 'research/?search="tag: drug-discovery"'
  description: Investigation of antibacterial microbial isolates, bioactive secondary metabolites, and biosynthetic gene clusters (BGCs) across environmental actinomycetes, myxobacteria, and pseudomonads to guide natural-product discovery and experimental validation.
