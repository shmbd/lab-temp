- title: Functional and Comparative Genome Analysis of Probiotic Bacteria with Glycemic Health-Promoting Potential
  subtitle: Shared Research Plan · MBD-SRP-01
  group: featured
  image: images/project-glycemic.svg
  link: research/?search=probiotic
  description: Coordinated genome-focused evaluation of four candidate probiotic bacterial isolates from indigenous sources—integrating whole-genome assembly, safety and resistome screening, carbohydrate-active enzyme (CAZyme) profiling, and comparative genomic analysis to prioritize strains with glycemic health-promoting potential.
  tags:
    - comparative-genomics
